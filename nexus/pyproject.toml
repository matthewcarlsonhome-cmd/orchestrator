[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "Personal AI Assistant Platform - Your intelligent knowledge companion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Matthew Carlson"}
]

dependencies = [
    # Core API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Vector Database (ChromaDB local, Pinecone cloud optional)
    "chromadb>=0.4.22",
    # "pinecone-client>=3.0.0",  # Uncomment for Pinecone

    # LLM Integration
    "anthropic>=0.18.0",
    "openai>=1.12.0",  # For embeddings (optional)

    # Embeddings
    "sentence-transformers>=2.3.0",  # Local embeddings
    # "voyageai>=0.2.0",  # Uncomment for Voyage AI embeddings

    # Document Processing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",

    # Audio/Voice (Phase 3)
    "openai-whisper>=20231117",  # Local transcription
    # "assemblyai>=0.23.0",  # Cloud transcription alternative

    # Database
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",  # Async SQLite for metadata
    # "asyncpg>=0.29.0",  # Uncomment for PostgreSQL

    # Background Jobs
    "celery>=5.3.0",
    "redis>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
]
cloud = [
    "pinecone-client>=3.0.0",
    "voyageai>=0.2.0",
    "asyncpg>=0.29.0",
]

[project.scripts]
nexus = "nexus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
